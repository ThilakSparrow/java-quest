var DESC={"Language basics":"Interviewers use these as quick filters. Learn each concept, predict the output of tricky snippets, and explain every point in under 60 seconds.","OOP":"Asked in almost every interview. Know each concept with a real project example, and be ready to write singleton and immutable classes from scratch.","Exception handling":"Short topic with many trick questions. Focus on finally behaviour, checked vs unchecked, and clean custom exceptions.","Collections":"The heaviest topic in Java rounds. Know the internals and time complexity, and be able to explain why, not just what.","Java 8 to 21":"A live-coding favourite. Practise streams hands-on and know what changed in Java 17 and 21.","Multithreading":"An interview favourite at 3+ years. Understand the concepts, then write the code: producer-consumer, deadlock, a custom thread pool.","JVM internals":"Shows depth beyond coding. Be able to draw the memory areas, explain GC, and describe how you would debug a memory leak.","Other core topics":"Supporting topics that often appear as follow-ups. Pair every pattern or principle with one real code example.","Arrays and hashing":"Start here. Practise frequency maps, duplicates, anagrams, two sum, prefix sums, and grouping problems.","Two pointers and sliding window":"Sorted-array pairs, container with most water, longest substring without repeats, fixed and variable windows.","Linked list, stack, queue":"Reverse a list, cycle detection, merge lists, valid parentheses, monotonic stack, queue using stacks.","Binary search":"Classic search, rotated array, first/last occurrence, and search on answer (capacity and speed problems).","Recursion and backtracking":"Subsets, permutations, combination sum, N-Queens, word search. Learn the choose, explore, un-choose template.","Trees and BST":"Traversals, height, LCA, validate BST, level order, serialize a tree. Do both recursive and iterative versions.","Heaps":"Top K elements, kth largest, merge K sorted lists, median from a stream, task scheduler.","Graphs (BFS, DFS, Dijkstra, union-find)":"Islands, course schedule, shortest path, cycle detection, topological sort, connected components.","Dynamic programming":"Knapsack, LIS, LCS, coin change, grid paths. Always go recursion first, then memoization, then tabulation.","Tries, intervals, bit manipulation":"Prefix tree, merge intervals, meeting rooms, single number, counting bits.","Spring Core":"Understand how Spring works internally, not just the annotations. Expect questions on bean lifecycle and proxies.","Spring Boot":"Know what @SpringBootApplication does, how auto-configuration picks beans, and how to structure error handling.","REST design":"Design clean APIs: correct methods and status codes, idempotency, pagination, and versioning.","JPA and Hibernate":"The most common source of production bugs and interview questions. Reproduce the N+1 problem yourself and fix it.","SQL":"Practise writing queries by hand. Joins, window functions, and indexing questions appear in almost every round.","Security":"Be able to draw the JWT flow and the Spring Security filter chain on a whiteboard.","Testing":"Shows code quality: unit tests with Mockito, slice tests, and integration tests against a real database.","Architecture":"Understand why and when to split a monolith, and what infrastructure microservices need.","Resilience":"How services survive failures. Try Resilience4j on a small demo and watch the circuit breaker states change.","Patterns":"Data consistency without 2PC. Be able to draw a saga and explain how failures are compensated.","Kafka":"A high-demand skill. Run Kafka locally, build a producer and consumer, and break it to see rebalancing.","Redis":"Caching strategies and failure modes matter more than commands. Know stampede and invalidation.","Observability":"How you find problems in production: structured logs, metrics, and traces linked by a correlation ID.","Fundamentals":"Building blocks reused in every design. Learn the trade-offs, not just the definitions.","HLD practice":"For each design cover requirements, estimates, APIs, data model, architecture, and bottlenecks. Practise speaking for 35 minutes.","LLD practice (code in Java)":"Write real classes using SOLID and patterns. Focus on clean entities, interfaces, and extensibility.","Docker":"Package your Spring Boot app. Know image layers and multi-stage builds.","Kubernetes":"Enough to deploy and scale your service and explain how pods talk to each other.","CI/CD and Git":"Automate build, test, and deploy. Git questions are common basic filters.","AWS":"Learn the core services through a small project. Know what each is for and when to choose it.","Prepare":"Your story matters as much as your skills. Write it down and rehearse it aloud.","Execute":"Consistency wins. Do mock interviews and applications every week, not only at the end."};
var HINT={"JDK vs JRE vs JVM":"What each contains; bytecode and write once, run anywhere","Primitives, wrappers, Integer cache":"Autoboxing, unboxing, why 127 == 127 but 128 != 128","== vs equals()":"Reference vs content comparison; overriding equals","String pool, immutability, intern()":"Why String is immutable; new String vs literal","StringBuilder vs StringBuffer":"Thread safety, performance, when to use which","Pass by value trap":"Java is always pass by value, even for object references","static, final, finally, finalize":"Four commonly confused keywords; usage of each","Init order: static, instance, constructor":"Order with inheritance; predict-the-output questions","Overloading vs overriding":"Compile-time vs runtime; rules; static and private methods","Type casting, overflow, char arithmetic":"Implicit and explicit casts, int overflow, byte and char tricks","Varargs, var, switch expressions":"Syntax, restrictions, modern switch with yield","Four pillars with examples":"Encapsulation, inheritance, polymorphism, abstraction with real examples","Abstract class vs interface (default/static)":"When to pick which; default methods and diamond conflicts","Composition vs inheritance":"Has-a vs is-a; why composition is preferred","Polymorphism and dynamic dispatch":"Upcasting, downcasting, which method actually gets called","equals/hashCode contract":"The rules, and what breaks in HashMap if violated","Comparable vs Comparator":"Natural vs custom order; sorting by multiple fields","Immutable class and Singleton variants":"Steps for immutability; eager, lazy, double-checked, enum singleton","Shallow vs deep clone":"clone(), copy constructors, serialization-based copy","Inner classes":"Static nested, inner, local, anonymous; captured variables","Enums":"Fields, methods, abstract methods, singleton via enum","Checked vs unchecked, Error vs Exception":"The hierarchy, examples, and when to use each","finally edge cases":"When finally doesn’t run; return inside finally","try-with-resources":"AutoCloseable, close order, suppressed exceptions","Custom exceptions and chaining":"Extending Exception or RuntimeException; preserving the cause","Overriding rules with exceptions":"What an overriding method is allowed to throw","Hierarchy from memory":"Draw Iterable, Collection, List, Set, Queue and Map","ArrayList vs LinkedList vs Vector":"Internals, time complexities, resizing","HashMap internals (treeify, resize)":"Hashing, buckets, load factor 0.75, treeify at 8","ConcurrentHashMap internals":"Java 7 segments vs Java 8 CAS plus synchronized","HashSet, LinkedHashSet, TreeSet":"Backed by maps; ordering and null rules","TreeMap, LinkedHashMap, LRU cache":"Red-black tree, access order, build an LRU cache","PriorityQueue, Deque":"Heap internals, ArrayDeque, stack and queue usage","Fail-fast vs fail-safe":"ConcurrentModificationException and how to avoid it","Mutable keys and bad hashCode":"Effect on lookups; what a constant hashCode does","Collections and Arrays utilities":"sort, binarySearch, unmodifiable views, List.of immutability","Lambdas, functional interfaces":"Predicate, Function, Consumer, Supplier, method references","Stream operations":"map, filter, flatMap, reduce; lazy vs terminal operations","Collectors: groupingBy, toMap":"Grouping, partitioning, counting, merge functions","Optional usage":"Correct usage, orElse vs orElseGet, common misuse","CompletableFuture":"supplyAsync, thenCombine, allOf, exception handling","Date/Time API":"LocalDate, ZonedDateTime, Duration, formatting","Records, sealed classes, pattern matching":"Java 17 features and where each one helps","Virtual threads":"Java 21; vs platform threads; when to use them","30 stream coding problems":"Frequency count, second highest, group names, flatten lists","Thread lifecycle, Runnable vs Callable":"Thread states, start vs run, returning results","synchronized (object vs class lock)":"Method vs block, and which lock each one takes","volatile and Java Memory Model":"Visibility vs atomicity; happens-before","Deadlock: create, detect, prevent":"Write one, find it with jstack, fix with lock ordering","ReentrantLock, ReadWriteLock":"tryLock, fairness, how it differs from synchronized","Atomics and CAS":"AtomicInteger, compare-and-swap, the ABA problem","ThreadLocal":"Use cases and the memory leak risk in thread pools","ExecutorService, ThreadPoolExecutor params":"Core and max size, queue, rejection policies, pool sizing","Latch, Barrier, Semaphore":"Differences, plus one example for each","Producer-consumer with BlockingQueue":"Write it from scratch, also with wait/notify","Odd-even printing with two threads":"Classic coding round; solve with wait/notify and semaphores","Memory areas: heap, stack, metaspace":"What lives where; young and old generations","Class loaders and delegation":"Bootstrap, platform, application; parent-first model","GC types: G1, ZGC":"Minor, major and full GC; collectors compared","Strong/weak/soft/phantom references":"When GC clears each one; WeakHashMap","OutOfMemory and StackOverflow":"Causes, fixes, and common examples","Heap dump and jstack debugging":"jmap, VisualVM, reading thread dumps","JIT and JVM flags":"-Xms, -Xmx, -XX options, warm-up","Generics, wildcards, type erasure":"Bounded types, PECS, why generic arrays aren’t allowed","Serialization":"serialVersionUID, transient, custom serialization","Reflection and annotations":"Write a custom annotation; how Spring uses them","NIO and file handling":"Files, Paths, channels, buffers vs classic IO","SOLID principles":"One code example for each principle","Creational patterns":"Singleton, Factory, Abstract Factory, Builder, Prototype","Structural and behavioral patterns":"Adapter, Decorator, Proxy, Observer, Strategy, Template","Learn the pattern":"Understand the template and when it applies","Solve 8 easy problems":"Build confidence and speed on the pattern","Solve 8 medium problems":"These are what interviews actually ask","Revisit mistakes and explain aloud":"Re-solve failed problems and narrate your approach"};

function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function $(i){return document.getElementById(i)}
function today(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function pd(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]).getTime()}
function bump(){var t=today();if(st.last===t)return;var y=new Date();y.setDate(y.getDate()-1);st.streak=st.last===today(y)?st.streak+1:1;st.last=t;st.best=Math.max(st.best,st.streak)}
function live(n,l){return l&&Math.round((pd(today())-pd(l))/864e5)<=1?n:0}
function esc(x){return String(x).replace(/[&<>]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'}).replace(/'/g,'&#39;')}
function toast(m){var e=$('toast');e.textContent=m;e.className='s';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},1600)}
function logTot(f){var x=0;for(var d in st.log)x+=st.log[d][f]||0;return x}
function revTot(){var x=0;for(var k in st.rev)x+=st.rev[k];return x}
function goalDays(){var c=0;for(var d in st.log)if((st.log[d].min||0)>=st.goal)c++;return c}
function extraXp(){return revTot()*2+logTot('dsa')*3+Object.keys(st.log).length*10}
function topics(p){var a=D[p].t.map(function(x,t){return{id:p+'.'+t,n:x[0],subs:x[1],desc:DESC[x[0]],c:0}});
 st.custom.forEach(function(c){if(c.p===p)a.push({id:c.id,n:c.n,subs:c.subs,desc:c.d,c:1})});
 var o=st.order[p]||[];a.sort(function(x,y){var i=o.indexOf(x.id),j=o.indexOf(y.id);return(i<0?999:i)-(j<0?999:j)});return a}
function pri(t){return st.pr[t.id]||(HI.indexOf(t.n)>=0?'H':LO.indexOf(t.n)>=0?'L':'M')}
function K(t,s){return t.id+'.'+s}
function cnt(t){return t.subs.filter(function(_,s){return st.done[K(t,s)]}).length}
function findT(id){var r;D.forEach(function(P,p){topics(p).forEach(function(t){if(t.id===id)r=t})});return r}
function idx(id){return topics(cur).map(function(t){return t.id}).indexOf(id)}
function mv(id,to){var ids=topics(cur).map(function(t){return t.id}),i=ids.indexOf(id);if(i<0||to<0||to>=ids.length)return;ids.splice(i,1);ids.splice(to,0,id);st.order[cur]=ids;save();render()}
function stats(){var n=0,tot=0,tp=0,ph=[],wn=0,wt=0;
 D.forEach(function(P,p){var a=0,b=0;topics(p).forEach(function(t){var c=cnt(t),w=PW[pri(t)];a+=c;b+=t.subs.length;wn+=w*c/t.subs.length;wt+=w;if(c===t.subs.length)tp++});n+=a;tot+=b;ph.push([a,b])});
 return{n:n,tot:tot,tp:tp,ph:ph,w:wt?wn/wt:0,xp:n*XP+tp*BONUS+extraXp()}}
function ready(s){var d=0;for(var i=0;i<30;i++){var x=new Date();x.setDate(x.getDate()-i);if(st.log[today(x)])d++}
 var p=[s.w*70,Math.min(1,d/20)*15,Math.min(1,logTot('dsa')/150)*10,Math.min(1,revTot()/50)*5];return{v:Math.round(p[0]+p[1]+p[2]+p[3]),p:p,d:d}}
function dueList(){var o=[];D.forEach(function(P,p){topics(p).forEach(function(t){t.subs.forEach(function(x,s){var k=K(t,s);if(st.done[k]&&st.when[k]){var g=st.rev[k]||0;if(g<IV.length&&Math.floor((pd(today())-pd(st.when[k]))/864e5)>=IV[g])o.push({k:k,name:x,topic:t.n,stage:g})}})})});return o}
var BADGES=[['🚀','First Step','Complete 1 item',function(s){return s.n>=1}],['📚','Topic Master','Finish a full topic',function(s){return s.tp>=1}],['🔟','Ten Down','10 items',function(s){return s.n>=10}],['💯','Century','100 items',function(s){return s.n>=100}],['🔥','Week Warrior','7-day streak',function(){return st.best>=7}],['⚡','Month Machine','30-day streak',function(){return st.best>=30}],['🏔️','Halfway','50% overall',function(s){return s.n*2>=s.tot}],['🍅','Focus 50','50 hours logged',function(){return logTot('min')>=3000}],['💻','Problem Solver','100 DSA problems',function(){return logTot('dsa')>=100}],['🔁','Reviser','20 revisions',function(){return revTot()>=20}],['🎯','Goal Getter','Goal hit 7 days',function(){return goalDays()>=7}],['🏆','Offer Ready','100% complete',function(s){return s.n===s.tot}]];
/* dialogs */
function dlg(h){$('dlg').innerHTML="<div class='px'>"+h+'</div>';$('dlg').hidden=false;var f=$('dlg').querySelector('input,textarea');if(f)f.focus()}
function closeD(){$('dlg').hidden=true;$('dlg').innerHTML=''}
function ask(m,fn){onYes=fn;dlg(`<h2>⚠ CONFIRM</h2><p>${m}</p><div class='row'><button class='b' id='yes'>YES</button><button class='b' data-close='1'>NO</button></div>`)}
function askName(){dlg(`<h2>PLAYER 1</h2><p>ENTER YOUR NAME TO BEGIN YOUR QUEST</p><input id='nm' maxlength='20' value='${esc(st.name)}' placeholder='YOUR NAME'><div class='row' style='margin-top:12px'><button class='b' id='nok'>▶ START</button>${st.name?"<button class='b' data-close='1'>CANCEL</button>":''}</div>`)}
function openAdd(){var dc=typeof cur==='number'?cur:7;dlg(`<h2>＋ NEW QUEST</h2><label class='f'>Topic name<input id='an' maxlength='80'></label><label class='f'>Description (what to study)<textarea id='ad' rows='3'></textarea></label><label class='f'>Sub-topics, one per line (optional)<textarea id='as' rows='3'></textarea></label><div class='row'><label class='f grow'>Category<select id='ac'>${D.map(function(P,i){return `<option value='${i}'${i===dc?' selected':''}>${P.i} ${P.n}</option>`}).join('')}</select></label><label class='f grow'>Priority<select id='ap'><option value='H'>🔴 High</option><option value='M' selected>🟡 Medium</option><option value='L'>🟢 Low</option></select></label></div><div class='row' style='margin-top:10px'><button class='b' id='aok'>ADD</button><button class='b' data-close='1'>CANCEL</button></div>`)}
function addTopic(){var n=$('an').value.trim().slice(0,80);if(!n){toast('Enter a topic name');return}
 var subs=$('as').value.split('\n').map(function(x){return x.trim().slice(0,80)}).filter(Boolean).slice(0,20),id='c'+Date.now(),p=+$('ac').value;
 st.custom.push({id:id,p:p,n:n,d:$('ad').value.trim().slice(0,300),subs:subs.length?subs:[n]});st.pr[id]=$('ap').value;
 cur=p;flt='A';save();closeD();render();toast('⭐ Quest added')}
$('dlg').addEventListener('click',function(e){var i=e.target.id;
 if(e.target.getAttribute('data-close'))closeD();
 if(i==='yes'){closeD();if(onYes)onYes()}
 if(i==='nok'){st.name=$('nm').value.trim().slice(0,20)||'Player';save();closeD();render()}
 if(i==='aok')addTopic()});
$('dlg').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='nm')$('nok').click()});
$('fab').onclick=openAdd;$('ttl').onclick=askName;
/* views */
function viewPhase(p){var h=`<div class='chips'>${[['A','All'],['H','🔴 High'],['M','🟡 Medium'],['L','🟢 Low']].map(function(f){return `<button class='tab${flt===f[0]?' on':''}' data-f='${f[0]}'>${f[1]}</button>`}).join('')}</div>`,a=topics(p);
 if(!a.length)h+=`<div class='card mu'>No topics here yet. Tap the + button to add your own.</div>`;
 a.forEach(function(t){var pr=pri(t);if(flt!=='A'&&pr!==flt)return;var c=cnt(t),n=t.subs.length,k=t.id;
  h+=`<details data-k='${k}'${open[k]?' open':''}><summary><span class='hd' draggable='true' data-id='${k}' title='Drag to reorder'>⠿</span><span class='nm'>${c===n?"<span class='dn'>✔</span> ":''}${esc(t.n)}</span><button class='pr ${pr}' data-pr='${k}' title='Change priority'>${{H:'High',M:'Med',L:'Low'}[pr]}</button><span class='pc'>${c}/${n}</span><span class='mvb'><button data-mv='${k}' data-d='-1' title='Move up'>▲</button><button data-mv='${k}' data-d='1' title='Move down'>▼</button></span>${t.c?`<button class='x' data-del='${k}' title='Delete topic'>✕</button>`:''}</summary><div class='subs'>${t.desc?`<p class='ds'>📖 ${esc(t.desc)}</p>`:''}`;
  t.subs.forEach(function(x,s){var d=st.done[K(t,s)];h+=`<label class='${d?'d':''}'><input type='checkbox' data-k='${k}' data-s='${s}'${d?' checked':''}><span>${esc(x)}${HINT[x]?`<small class='hn'>${HINT[x]}</small>`:''}</span></label>`});
  h+='</div></details>'});return h}
function viewLog(){var e=st.log[today()]||{},h=`<div class='card'><b>📅 Log today</b><div class='row' style='margin-top:10px'><label class='f'>Minutes studied<input type='number' id='lm' min='0' value='${e.min||''}'></label><label class='f'>DSA problems solved<input type='number' id='ld' min='0' value='${e.dsa||''}'></label><label class='f'>Daily goal (min)<input type='number' id='lg' min='10' value='${st.goal}'></label></div><label class='f' style='margin-top:8px'>What did I learn? What was hard?<textarea id='ln' style='height:70px'>${esc(e.note||'')}</textarea></label><div class='row' style='margin-top:8px'><button class='b' id='lsv'>Save today</button><span class='mu'>+10 XP per logged day, +3 XP per DSA problem. The 🍅 timer adds minutes automatically.</span></div></div><div class='card'><b>Last 14 days</b><div class='ch'>`;
 for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var m=(st.log[today(d)]||{}).min||0;h+=`<div class='cb' title='${m} min'><i class='${m>=st.goal?'g':''}' style='height:${Math.min(100,m/st.goal*100)}%'></i><span>${d.getDate()}</span></div>`}
 h+=`</div><div class='mu'>Green = goal reached · ${Math.round(logTot('min')/6)/10} hours total · ${logTot('dsa')} DSA problems</div></div>`;
 var ks=Object.keys(st.log).sort(function(a,b){return pd(b)-pd(a)}).slice(0,10);
 if(ks.length)h+="<div class='card'><b>History</b>"+ks.map(function(k){var x=st.log[k];return `<div class='lg'><span><b>${k}</b> · ${x.min||0} min · ${x.dsa||0} DSA<br><span class='mu'>${esc(x.note||'')}</span></span></div>`}).join('')+'</div>';
 return h}
function viewRev(){var q=dueList();if(!q.length)return `<div class='card'>🎉 Nothing due right now. Revision reminders appear 3, 7, and 30 days after you complete an item.</div>`;
 return `<div class='card'><b>🔁 Due for revision</b><p class='mu'>Explain each one aloud without notes, then tap Revised. +2 XP each.</p>`+q.map(function(o){return `<div class='rv'><span><b>${esc(o.name)}</b><br><span class='mu'>${esc(o.topic)} · round ${o.stage+1} of 3</span></span><button class='b' data-r='${o.k}'>Revised ✓</button></div>`}).join('')+'</div>'}
function paceTxt(s){var c=0,now=pd(today());for(var k in st.done){var w=st.when[k];if(w&&(now-pd(w))/864e5<14)c++}
 var rem=s.tot-s.n;if(!rem)return '🎉 All items complete!';if(!c)return '⏳ Complete a few items to get a pace estimate.';
 var d=Math.ceil(rem/(c/14));return `⏱️ Pace: ${(c/14).toFixed(1)} items/day over the last 14 days → about ${d} days for the remaining ${rem} items (around ${new Date(Date.now()+d*864e5).toLocaleDateString()}).`}
function viewDash(s){var r=ready(s),tier=RT.filter(function(x){return r.v>=x[0]}).pop()[1],bl='';for(var i=0;i<20;i++)bl+=`<i class='${i<r.v/5?'on':''}'></i>`;
 var h=`<div class='card'><div class='mu'>JOB READINESS</div><div class='big'>${r.v}%</div><div class='seg'>${bl}</div><b>${tier}</b><p class='mu'>📝 Note: this score is only a motivational estimate, not a real prediction. Hiring depends on interviews, the market, and luck. Use it to see your momentum, not to judge yourself.</p><p class='mu'>How it’s built: 70% priority-weighted topic completion (${Math.round(r.p[0])} pts), 15% consistency (${r.d}/20 days logged in the last 30 → ${Math.round(r.p[1])}), 10% DSA volume (${logTot('dsa')}/150 → ${Math.round(r.p[2])}), 5% revision (${revTot()}/50 → ${Math.round(r.p[3])}).</p><div>${paceTxt(s)}</div></div>`;
 h+=`<div class='grid'>${[['⭐',s.xp,'XP'],['🔥',live(st.streak,st.last),'streak'],['🏅',st.best,'best streak'],['✅',s.n+'/'+s.tot,'items'],['⏱️',Math.round(logTot('min')/6)/10,'hours'],['💻',logTot('dsa'),'DSA solved'],['🔁',revTot(),'revisions'],['🎯',goalDays(),'goal days']].map(function(x){return `<div class='sc'><big>${x[0]}</big><b>${x[1]}</b><span class='mu'>${x[2]}</span></div>`}).join('')}</div>`;
 h+=`<div class='card'><b>🗺️ Skill levels</b>${D.map(function(P,p){var q=s.ph[p];if(!q[1])return '';var v=Math.round(q[0]/q[1]*100);return `<div style='margin-top:10px'><div class='row'><span class='grow'>${P.i} ${P.n}</span><span class='mu'>${v}%</span></div><div class='bar'><i style='width:${v}%'></i></div></div>`}).join('')}</div>`;
 var f=[];D.forEach(function(P,p){topics(p).forEach(function(t){var c=cnt(t);if(c<t.subs.length)f.push({t:t,p:p,fr:c/t.subs.length,w:PW[pri(t)]})})});
 f.sort(function(a,b){return b.w-a.w||b.fr-a.fr});
 h+=`<div class='card'><b>🎯 Focus next</b><p class='mu'>Highest priority first, then closest to done. Tap to open.</p>${f.slice(0,5).map(function(x){return `<div class='lg' data-go='${x.p}' style='cursor:pointer'><span><b>${esc(x.t.n)}</b> <span class='pr ${pri(x.t)}'>${{H:'High',M:'Med',L:'Low'}[pri(x.t)]}</span><br><span class='mu'>${D[x.p].n} · ${cnt(x.t)}/${x.t.subs.length} done</span></span></div>`}).join('')||'🎉 Nothing left!'}</div>`;
 var hm='';for(var j=27;j>=0;j--){var d=new Date();d.setDate(d.getDate()-j);var m=(st.log[today(d)]||{}).min||0;hm+=`<i class='${m>=st.goal?'h3':m>=st.goal/2?'h2':m>0?'h1':''}' title='${today(d)}: ${m} min'></i>`}
 h+=`<div class='card'><b>📆 Last 28 days</b><div class='heat'>${hm}</div></div><div class='card'><b>🏅 Badges</b><div class='badges' style='margin-top:10px'>${BADGES.map(function(b){return `<div class='bd${b[3](s)?' on':''}'><big>${b[0]}</big><b>${b[1]}</b><br>${b[2]}</div>`}).join('')}</div></div>`;
 return h}
function renderTop(){var m=(st.log[today()]||{}).min||0,b=null;
 $('goal').textContent='🎯 Today: '+m+' / '+st.goal+' min'+(m>=st.goal?' ✅':'');
 D.forEach(function(P,p){topics(p).forEach(function(t){for(var s=0;s<t.subs.length;s++)if(!st.done[K(t,s)]){var w=PW[pri(t)];if(!b||w>b.w)b={w:w,x:P.n+' › '+t.n+' › '+t.subs[s]};return}})});
 $('next').textContent=b?'➡️ Next up: '+b.x:'🏆 Everything complete!'}
function render(){var s=stats(),dash=PG==='d',lv=Math.floor(s.xp/PER);
 $('ttl').textContent='⚔️ '+(st.name||'Player')+'’s Java Quest';
 $('lvl').textContent='Level '+(lv+1)+' · '+TITLES[Math.min(lv,TITLES.length-1)];
 $('xpbar').style.width=(s.xp%PER)/PER*100+'%';
 $('xptx').textContent=s.xp+' XP · '+(PER-s.xp%PER)+' XP to next level';
 $('streak').textContent=live(st.streak,st.last);$('pct').textContent=Math.round(s.n/s.tot*100)+'%';renderTop();
 $('pgMain').hidden=dash;$('pgDash').hidden=!dash;$('fab').hidden=dash;
 $('nT').className='tab'+(dash?'':' on');$('nD').className='tab'+(dash?' on':'');
 if(dash){$('pgDash').innerHTML=viewDash(s);return}
 $('tabs').innerHTML=D.map(function(P,p){var q=s.ph[p];return `<button class='tab${p===cur?' on':''}' data-p='${p}'>${P.i} ${P.n}${q[1]?' '+Math.round(q[0]/q[1]*100)+'%':''}</button>`}).join('')+[['log','📅 Daily Log'],['rev','🔁 Revise ('+dueList().length+')']].map(function(v){return `<button class='tab${cur===v[0]?' on':''}' data-p='${v[0]}'>${v[1]}</button>`}).join('');
 $('list').innerHTML=cur==='log'?viewLog():cur==='rev'?viewRev():viewPhase(cur)}
/* events */
var L=$('list');
$('tabs').onclick=function(e){var p=e.target.getAttribute('data-p');if(p!==null){cur=isNaN(+p)?p:+p;render()}};
$('pgDash').onclick=function(e){var g=e.target.closest('[data-go]');if(g){cur=+g.getAttribute('data-go');go('m')}};
L.addEventListener('toggle',function(e){var k=e.target.getAttribute('data-k');if(k)open[k]=e.target.open},true);
L.onchange=function(e){var x=e.target;if(x.type!=='checkbox')return;var t=findT(x.getAttribute('data-k')),k=x.getAttribute('data-k')+'.'+x.getAttribute('data-s'),was=cnt(t);
 if(x.checked){st.done[k]=1;st.when[k]=today();bump();toast(cnt(t)===t.subs.length&&was<t.subs.length?'🎉 Topic complete! +'+(XP+BONUS)+' XP':'+'+XP+' XP')}else delete st.done[k];save();render()};
L.addEventListener('click',function(e){var x=e.target,g=function(a){return x.getAttribute(a)},f=g('data-f'),pk=g('data-pr'),m=g('data-mv'),dl=g('data-del'),r=g('data-r');
 if(f){flt=f;render()}
 if(pk){e.preventDefault();st.pr[pk]=({H:'M',M:'L',L:'H'})[pri(findT(pk))];save();render()}
 if(m){e.preventDefault();mv(m,idx(m)+ +g('data-d'))}
 if(dl){e.preventDefault();ask('Delete this topic and its progress?',function(){st.custom=st.custom.filter(function(c){return c.id!==dl});for(var k in st.done)if(k.indexOf(dl+'.')===0)delete st.done[k];delete st.pr[dl];save();render()})}
 if(x.id==='lsv'){var mi=+$('lm').value||0,ds=+$('ld').value||0,n=$('ln').value.trim().slice(0,300);st.goal=Math.max(10,+$('lg').value||120);if(mi||ds||n){st.log[today()]={min:mi,dsa:ds,note:n};bump();toast('Saved ✔')}save();render()}
 if(r){st.rev[r]=(st.rev[r]||0)+1;bump();save();toast('Revised ✔ +2 XP');render()}});
L.addEventListener('dragstart',function(e){var h=e.target.closest&&e.target.closest('.hd');if(!h)return;drag=h.getAttribute('data-id');e.dataTransfer.setData('text/plain',drag);var d=h.closest('details');if(d)e.dataTransfer.setDragImage(d,10,10)});
L.addEventListener('dragover',function(e){if(!drag)return;e.preventDefault();var d=e.target.closest('details');L.querySelectorAll('.dov').forEach(function(z){z.classList.remove('dov')});if(d)d.classList.add('dov')});
L.addEventListener('drop',function(e){if(!drag)return;e.preventDefault();var d=e.target.closest('details'),id=drag;drag=null;if(d&&d.getAttribute('data-k')!==id)mv(id,idx(d.getAttribute('data-k')))});
L.addEventListener('dragend',function(){drag=null;L.querySelectorAll('.dov').forEach(function(z){z.classList.remove('dov')})});
$('ex').onclick=function(){var a=$('json');a.value=JSON.stringify(st,null,1);a.select()};
$('im').onclick=function(){try{var o=JSON.parse($('json').value);if(!o||typeof o.done!=='object')throw 0;st=Object.assign(BASE(),o);save();render();toast('Imported ✔')}catch(e){toast('Invalid JSON')}};
$('rs').onclick=function(){ask('Reset ALL progress and custom topics?',function(){st=BASE();save();render();askName()})};
function tick(){var r=Math.max(0,tEnd-Date.now());$('tm').textContent=Math.floor(r/6e4)+':'+('0'+Math.floor(r%6e4/1e3)).slice(-2);
 if(r<=0){clearInterval(ti);ti=null;tEnd=0;$('tbtn').textContent='▶ Focus';$('tm').textContent='25:00';var t=today(),e=st.log[t]=st.log[t]||{min:0,dsa:0,note:''};e.min=(e.min||0)+25;bump();save();toast('🍅 +25 min logged!');render()}}
$('tbtn').onclick=function(){if(ti){clearInterval(ti);ti=null;tEnd=0;this.textContent='▶ Focus';$('tm').textContent='25:00';return}tEnd=Date.now()+25*6e4;this.textContent='■ Stop';tick();ti=setInterval(tick,500)};
for(var k in st.done)if(!st.when[k])st.when[k]=today();
var PG=location.hash==='#dashboard'?'d':'m';
function go(p){PG=p;try{location.hash=p==='d'?'#dashboard':'#tracker'}catch(e){}render();window.scrollTo(0,0)}
$('nT').onclick=function(e){e.preventDefault();go('m')};$('nD').onclick=function(e){e.preventDefault();go('d')};
window.addEventListener('hashchange',function(){PG=location.hash==='#dashboard'?'d':'m';render()});
render();
if(!st.name)askName();

</script>
